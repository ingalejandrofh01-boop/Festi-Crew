<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030304">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Festi Crew">
<title>Festi Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Concepto: cabina de mando en el espacio profundo. Negro absoluto, rojo de señal para todo lo que el crew elige,
   verde de radar para lo que está vivo o confirmado. Tipografía industrial condensada. Tema oscuro deliberado. */
:root{
  color-scheme:dark;
  --void:#030304; --ink:#F2F2F0; --dim:#A6A6A3; --faint:#6B6B69;
  --glass:rgba(10,10,12,.58); --glass-2:rgba(26,26,30,.62); --glass-hi:rgba(255,255,255,.06);
  --edge:rgba(255,255,255,.10); --edge-hi:rgba(255,255,255,.22);
  --red:#E3262F; --red-hi:#FF4049; --red-deep:#7A0E14; --green:#2BD96B; --green-deep:#0B5A2C; --amber:#F5A524;
  --sig:linear-gradient(100deg,#FF4049,#B3121B);
  --ok:var(--green); --warn:var(--amber); --bad:var(--red-hi);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --blur:saturate(140%) blur(18px);
}
*{box-sizing:border-box}
html{background:var(--void)}
body{margin:0;min-height:100dvh;background:transparent;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-inline:16px;padding-block:env(safe-area-inset-top,0px) calc(110px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:.95;text-transform:uppercase}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--dim)}
.grad{color:var(--ink)}
.grad em{font-style:normal;color:var(--red-hi)}

/* ---------- espacio ---------- */
#space,#sky{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#space{z-index:-3;background:radial-gradient(80% 60% at 30% 30%,#2a0508,transparent 60%),radial-gradient(70% 50% at 80% 80%,#03261a,transparent 60%),#020203}
#sky{z-index:-2}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 55%,rgba(0,0,0,.7))}

.wrap{max-width:1140px;margin:0 auto;position:relative}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 24px 60px -34px rgba(0,0,0,.95)}

/* ---------- barra superior ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:16px 14px}
.brand{font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px;line-height:1}
.orb{width:24px;height:24px;border-radius:50%;position:relative;flex:none;
  background:radial-gradient(circle at 34% 30%,#ff8a8f 0 6%,var(--red) 30%,var(--red-deep) 70%,#1a0204 100%);box-shadow:0 0 16px rgba(227,38,47,.75)}
.orb::after{content:"";position:absolute;inset:-4px -10px;border-radius:50%;border:1.5px solid var(--green);transform:rotate(-22deg) scaleY(.3);opacity:.9}
.sp{flex:1}
.mode{font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 8px;border-radius:4px;border:1px solid rgba(245,165,36,.45);color:var(--amber)}
.mode.live{border-color:rgba(43,217,107,.45);color:var(--green)}
.mode.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green);vertical-align:1px}
.evpick{appearance:none;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--edge);border-radius:10px;padding:9px 34px 9px 13px;font-weight:700;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.evpick option{background:#111}
.mebtn{border:0;background:transparent;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:0}

/* ---------- héroe ---------- */
.hero{position:relative;padding:24px 24px 18px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;border-radius:20px}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red);box-shadow:0 0 22px var(--red)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(227,38,47,.25),transparent 65%);pointer-events:none}
.hero .kick{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.hero h1{font-size:clamp(44px,9vw,96px);font-weight:900;letter-spacing:.005em}
.hero .meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:12px;color:var(--dim);font-size:15px}
.hero .meta b{color:var(--ink);font-weight:700}
.cd{display:flex;gap:6px}
.cd div{min-width:64px;text-align:center;padding:10px 6px 8px;border-radius:8px;background:rgba(0,0,0,.55);border:1px solid var(--edge);position:relative;overflow:hidden}
.cd div::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.07)}
.cd b{display:block;font-family:var(--f-mono);font-size:clamp(24px,4.4vw,38px);font-weight:800;line-height:1}
.cd div:first-child b{color:var(--red-hi);text-shadow:0 0 18px rgba(227,38,47,.6)}
.cd span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.rsvp{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding-top:16px;border-top:1px solid var(--edge)}
.rsvp .q{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;margin-right:4px}
.rbtn{border:1px solid var(--edge-hi);background:rgba(255,255,255,.03);border-radius:8px;padding:8px 16px;font-weight:700;font-size:14px}
.rbtn[aria-pressed="true"]{background:var(--green);border-color:transparent;color:#03140a;box-shadow:0 0 22px rgba(43,217,107,.45)}
.rbtn[data-v="no"][aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:0 0 22px rgba(227,38,47,.45)}
.rbtn[data-v="maybe"][aria-pressed="true"]{background:var(--amber);color:#1a1000;box-shadow:0 0 22px rgba(245,165,36,.4)}
.rsvp .going{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}

/* ---------- navegación ---------- */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:2px;padding:5px;border-radius:14px;
  max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;background:rgba(8,8,10,.78)}
.tab{border:0;background:transparent;padding:10px 14px;border-radius:10px;font-weight:700;font-size:13px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:6px;letter-spacing:.02em}
.tab svg{width:18px;height:18px}
.tab[aria-selected="true"]{background:var(--red);color:#fff;box-shadow:0 0 22px rgba(227,38,47,.55)}
.tab .live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
@media (max-width:520px){ .tab{padding:10px 11px} .tab .tlb{display:none} .tab[aria-selected="true"] .tlb{display:inline} }

main{margin-top:24px}
.sect{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-block:6px 14px}
.sect h2{font-size:clamp(34px,5.5vw,52px);font-weight:900;letter-spacing:.01em}
.sect h2::after{content:"";display:inline-block;width:10px;height:10px;background:var(--red);margin-left:8px;vertical-align:.12em;box-shadow:0 0 10px var(--red)}

/* ---------- controles ---------- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:0 14px}
.chip{border:1px solid var(--edge);background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:8px;height:8px;border-radius:2px}
.chip[aria-pressed="true"]{background:var(--ink);color:#0a0a0a;border-color:transparent}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:rgba(0,0,0,.6);border:1px solid var(--edge)}
.seg button{border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:700;font-size:12px;color:var(--dim);letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--edge);background:rgba(0,0,0,.55);border-radius:10px;padding:9px 14px}
.search::placeholder,.inp::placeholder{color:var(--faint)}
.btn{border:1px solid var(--edge-hi);background:rgba(255,255,255,.04);border-radius:10px;padding:9px 15px;font-weight:700;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;letter-spacing:.01em}
.btn.pri{background:var(--sig);border-color:transparent;color:#fff;box-shadow:0 8px 24px -8px rgba(227,38,47,.8)}
.btn.go{background:var(--green);border-color:transparent;color:#03140a}
.btn.danger{color:var(--red-hi);border-color:rgba(227,38,47,.5)}
.btn.ghost{background:transparent;border-color:transparent}

/* ---------- cartel ---------- */
.tier{margin-block:4px 30px}
.tier>header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.tier>header h3{font-size:22px;font-weight:800;letter-spacing:.04em}
.tier>header .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--edge-hi),transparent)}
.grid{display:grid;gap:12px}
.g1{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}

.card{position:relative;border-radius:16px;overflow:hidden;min-width:0;isolation:isolate;
  background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.card .ph{position:relative;display:block;width:100%;aspect-ratio:4/3;max-width:100%;border:0;padding:0;cursor:pointer;overflow:hidden;background:#000}
.g2 .card .ph{aspect-ratio:1/1}
.ph img,.mono-av{width:100%;height:100%;object-fit:cover;display:block}
.mono-av{display:grid;place-items:center;font-family:var(--f-display);font-weight:900;color:#fff;letter-spacing:.02em;position:relative}
.mono-av::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.card .ph .mono-av{font-size:150px;color:rgba(255,255,255,.13);align-items:start;padding-top:2%;line-height:1}
.ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.92));pointer-events:none}
.card .over{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;pointer-events:none}
.card .over h4{margin:0;font-family:var(--f-display);font-weight:900;font-size:28px;line-height:.92;text-transform:uppercase;overflow-wrap:anywhere;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.g2 .card .over h4{font-size:22px}
.tagrow{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
.tag{font-family:var(--f-mono);font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:4px;background:rgba(0,0,0,.72);border:1px solid var(--edge)}
.tag.spc{background:var(--green);color:#03140a;border-color:transparent}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px}
.slot{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:3px 8px;background:rgba(255,255,255,.06);font-weight:600}
.pill.tbd{background:transparent;border:1px dashed var(--edge-hi);color:var(--dim)}
.pill .dot{width:7px;height:7px;border-radius:2px}
.vrow{display:flex;align-items:center;gap:8px}
.vote{position:relative;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--edge-hi);background:rgba(255,255,255,.03);border-radius:9px;padding:6px 12px 6px 10px;font-weight:700;font-size:13px;transition:transform .15s}
.vote svg{width:16px;height:16px}
.vote:active{transform:scale(.92)}
.vote[aria-pressed="true"]{background:var(--sig);border-color:transparent;color:#fff;box-shadow:0 0 20px rgba(227,38,47,.6)}
.vote .lbl{font-size:12px;letter-spacing:.02em}

/* tarjeta elegida: marco rojo con barrido de luz + esquinas de mira */
.card.on{border-color:transparent;box-shadow:0 0 0 1.5px var(--red),0 0 40px -6px rgba(227,38,47,.75);transform:translateY(-2px)}
.card.on::before{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:inherit;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.18) 48%,transparent 60%) no-repeat;background-size:250% 100%;background-position:120% 0}
@media (prefers-reduced-motion:no-preference){ .card.on::before{animation:sweep 3.5s ease-in-out infinite} }
@keyframes sweep{0%,55%{background-position:120% 0}100%{background-position:-120% 0}}
.check{position:absolute;right:10px;top:10px;z-index:4;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--red);box-shadow:0 0 14px rgba(227,38,47,.9);color:#fff}
.check svg{width:15px;height:15px}

.row{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:11px;align-items:center;padding:8px 10px 8px 8px;border-radius:12px;min-width:0;isolation:isolate;
  background:var(--glass);border:1px solid var(--edge);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);transition:box-shadow .25s}
.row .av{width:48px;height:48px;border-radius:9px;overflow:hidden;border:0;padding:0;cursor:pointer}
.row .av .mono-av{font-size:20px}
.row .nm b{display:block;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:center;overflow:hidden;white-space:nowrap}
.row.on{border-color:transparent;box-shadow:0 0 0 1.5px var(--red),0 0 24px -4px rgba(227,38,47,.65)}

.stack{display:flex;align-items:center}
.pav{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:800;font-family:var(--f-display);overflow:hidden;flex:none}
.pav img{width:100%;height:100%;object-fit:cover}
.stack .pav,.stack .more{width:24px;height:24px;font-size:11px;border:2px solid #0b0b0d;margin-left:-7px}
.stack .pav:first-child{margin-left:0}
.stack .more{display:grid;place-items:center;border-radius:50%;background:var(--glass-2);font-size:10px;font-weight:800}
.mebtn .pav{width:32px;height:32px;font-size:14px;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.burst{position:fixed;pointer-events:none;z-index:60;left:0;top:0;border-radius:1px}

/* ---------- timeline ---------- */
.routebar{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px;scrollbar-width:thin}
.rstop{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:10px;background:var(--glass);border:1px solid var(--edge)}
.rstop .av{width:30px;height:30px;border-radius:7px;overflow:hidden}
.rstop .av .mono-av{font-size:13px}
.rstop b{display:block;font-size:13px;font-weight:700;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
.rstop small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--dim)}
.rarrow{flex:none;align-self:center;color:var(--red);font-weight:900}
.tlwrap{padding:14px 0 6px;border-radius:18px;overflow:hidden}
.tlhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:0 16px 12px}
.tlstats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.tlstats b{color:var(--ink);font-family:var(--f-mono)}
.tlscroll{overflow-x:auto;overscroll-behavior-x:contain;position:relative;padding-bottom:14px}
.tl{position:relative;display:grid;min-width:100%}
.tl .lanehd{position:sticky;top:0;z-index:6;font-family:var(--f-display);font-size:17px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:9px 6px;border-bottom:1px solid var(--edge);background:rgba(6,6,8,.82)}
.tl .lanehd small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:var(--dim);font-weight:500}
.tl .axis{position:relative}
.tl .axis span{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--ink)}
.tl .axis span.q{font-size:9px;color:var(--faint);font-weight:500}
.tl .lane{position:relative;border-left:1px solid rgba(255,255,255,.06)}
.tl .lane:nth-child(even){background:rgba(255,255,255,.012)}
.tl .hr{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.09)}
.tl .hr.q{background:rgba(255,255,255,.03)}
.blk{position:absolute;left:6px;right:6px;border-radius:9px;padding:7px 9px 7px 12px;overflow:hidden;display:flex;gap:9px;align-items:flex-start;z-index:2;
  background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--edge);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gc,#666)}
.blk .av{width:34px;height:34px;border-radius:7px;overflow:hidden;flex:none}
.blk .av .mono-av{font-size:14px}
.blk b{display:block;font-family:var(--f-display);font-size:18px;font-weight:800;text-transform:uppercase;line-height:.95;overflow-wrap:anywhere}
.blk small{display:block;font-family:var(--f-mono);font-size:10.5px;color:var(--dim);margin-top:3px}
.blk .vc{position:absolute;right:7px;bottom:6px;font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--dim)}
.blk.pick{background:linear-gradient(160deg,rgba(227,38,47,.38),rgba(122,14,20,.35));border-color:rgba(255,90,96,.55);box-shadow:0 0 28px -8px rgba(227,38,47,.9)}
.blk.pick small,.blk.pick .vc{color:#ffd0d2}
.blk.onr{box-shadow:0 0 0 1.5px var(--red-hi),0 0 34px -6px rgba(227,38,47,1)}
.blk.ghost{opacity:.38}
.blk.ghost:hover{opacity:.85}
.blk.lost{opacity:.6;background:repeating-linear-gradient(135deg,rgba(227,38,47,.14) 0 6px,rgba(0,0,0,.2) 6px 12px);border-style:dashed}
.blk .live-tag{position:absolute;right:7px;top:6px;font-family:var(--f-mono);font-size:9px;font-weight:800;letter-spacing:.12em;color:#03140a;background:var(--green);padding:2px 5px;border-radius:3px}
.routesvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.routesvg path{fill:none;stroke:var(--red-hi);stroke-width:2.5;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,64,73,.9))}
@media (prefers-reduced-motion:no-preference){ .routesvg path{stroke-dasharray:6 7;animation:march 1.2s linear infinite} }
@keyframes march{to{stroke-dashoffset:-26}}
.gap{position:absolute;z-index:4;transform:translate(-50%,-50%);white-space:nowrap;font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:5px;background:rgba(0,0,0,.85);border:1px solid var(--edge-hi);pointer-events:none}

/* ruta estimada (sin horarios) */
.route{position:relative;padding:8px 0 8px 34px}
.route::before{content:"";position:absolute;left:13px;top:12px;bottom:12px;width:2px;background:linear-gradient(var(--green),var(--red));box-shadow:0 0 12px rgba(227,38,47,.6);border-radius:2px}

.stop::before{content:"";position:absolute;left:-27px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:2px;transform:rotate(45deg);background:#000;border:2px solid var(--green);box-shadow:0 0 10px var(--green)}

/* ---------- ahora ---------- */

.onstage{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.live{display:grid;grid-template-columns:68px minmax(0,1fr);gap:14px;align-items:center;padding:12px;border-radius:14px;background:linear-gradient(120deg,rgba(43,217,107,.16),rgba(0,0,0,.2));border:1px solid rgba(43,217,107,.45)}
.live .av{width:68px;height:68px;border-radius:11px;overflow:hidden}

.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start}

.st.yes{background:rgba(43,217,107,.14);color:var(--green)} .st.maybe{background:rgba(245,165,36,.14);color:var(--amber)} .st.no{background:rgba(227,38,47,.16);color:var(--red-hi)} .st.none{color:var(--faint)}
.rank{display:grid;grid-template-columns:22px minmax(0,1fr) 30px;gap:4px 8px;align-items:center;font-size:14px;padding-block:5px}

.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

<script>
/* ================= ESPACIO =================
   Capa 1 (WebGL): nebulosas de emisión rojas (H-alfa) y verdes (OIII), banda de la Vía Láctea con polvo oscuro.
   Capa 2 (canvas): estrellas con color por temperatura, más densas en la banda, brillantes con picos de difracción. */
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // banda galáctica compartida por ambas capas: q.y en coordenadas centradas
  const bandY = (x,y) => -0.5*x + 0.86*y;

  /* ---- nebulosa WebGL ---- */
  const cv=document.getElementById('space');
  const gl=cv.getContext('webgl',{antialias:false,alpha:false,preserveDrawingBuffer:true,powerPreference:'low-power'});
  let draw1=null;
  if(gl){
    const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;
    const fs=`precision highp float;uniform vec2 R;uniform float T;
    float h(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<6;i++){v+=a*n(p);p=m*p;a*=.5;}return v;}
    void main(){
      vec2 uv=(gl_FragCoord.xy-.5*R)/R.y; float t=T*.006;
      vec2 q=mat2(.86,-.5,.5,.86)*uv;
      float wob=fbm(q*1.7+vec2(t*.6,0.))-.5;
      float band=exp(-pow((q.y+.08+wob*.35)*2.3,2.)*2.4);
      vec2 p=uv*1.45+vec2(t,t*.35);
      vec2 w=vec2(fbm(p),fbm(p+vec2(5.2,1.3)));
      vec2 w2=vec2(fbm(p+3.*w+vec2(1.7,9.2)),fbm(p+3.*w+vec2(8.3,2.8)));
      float neb=fbm(p+3.4*w2);
      float neb2=fbm(p*1.9+2.6*w+11.);
      float dust=smoothstep(.42,.78,fbm(q*vec2(3.,7.)+w*1.4+vec2(t*.4,0.)));
      vec3 col=vec3(.004,.004,.007);
      vec3 ha=vec3(.85,.07,.09), haDeep=vec3(.22,.015,.03), oiii=vec3(.03,.5,.27), core=vec3(.95,.88,.8);
      col+=haDeep*pow(neb,2.4)*1.35;
      col+=ha*pow(smoothstep(.5,1.,neb),2.)*1.6*(.35+band*.9);
      col+=oiii*pow(smoothstep(.52,1.,neb2),2.6)*1.2*(.5+(1.-band)*.6);
      float glow=band*(.35+.65*fbm(q*4.+w));
      col+=core*glow*.17;
      col+=vec3(.55,.6,.75)*pow(band,3.)*.05;
      col*=1.-dust*.78*smoothstep(.15,.9,band);
      col=1.-exp(-col*1.25);
      col+=(h(gl_FragCoord.xy+T)-.5)/255.;
      gl_FragColor=vec4(col,1.);
    }`;
    const sh=(type,src)=>{ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); return gl.getShaderParameter(s,gl.COMPILE_STATUS)?s:null; };
    const v=sh(gl.VERTEX_SHADER,vs), f=sh(gl.FRAGMENT_SHADER,fs);
    if(v&&f){
      const pr=gl.createProgram(); gl.attachShader(pr,v); gl.attachShader(pr,f); gl.linkProgram(pr);
      if(gl.getProgramParameter(pr,gl.LINK_STATUS)){
        gl.useProgram(pr);
        const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
        const loc=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
        const uR=gl.getUniformLocation(pr,'R'), uT=gl.getUniformLocation(pr,'T');
        const scale=.5; // media resolución: se ve suave y cuida la batería
        const fit=()=>{ cv.width=Math.max(2,Math.round(innerWidth*scale)); cv.height=Math.max(2,Math.round(innerHeight*scale)); gl.viewport(0,0,cv.width,cv.height); gl.uniform2f(uR,cv.width,cv.height); };
        fit(); addEventListener('resize',()=>{ fit(); draw1(performance.now()); });
        draw1=t=>{ gl.uniform1f(uT,t/1000); gl.drawArrays(gl.TRIANGLES,0,3); };
      }
    }
  }

  /* ---- estrellas ---- */
  const c=document.getElementById('sky'), x=c.getContext('2d');
  const TEMPS=['155,176,255','170,191,255','202,215,255','248,247,255','255,244,234','255,210,161','255,204,111','255,166,120'];
  let W,H,stars=[],bright=[];
  function build(){
    const dpr=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; c.width=W*dpr; c.height=H*dpr; x.setTransform(dpr,0,0,dpr,0,0);
    const target=Math.round(Math.min(2400,W*H/520)); stars=[]; bright=[];
    let guard=0;
    while(stars.length<target && guard++<target*6){
      const px=Math.random()*W, py=Math.random()*H;
      const ux=(px-W/2)/H, uy=-(py-H/2)/H; const q=bandY(ux,uy)+.08;
      const dens=.18+.82*Math.exp(-Math.pow(q*2.3,2)*2.4);
      if(Math.random()>dens) continue;
      const mag=Math.pow(Math.random(),3.2);
      stars.push({x:px,y:py,r:.25+mag*1.35,a:.25+mag*.75,c:TEMPS[(Math.random()*TEMPS.length)|0],tw:Math.random()*6.28,sp:.5+Math.random()*2});
    }
    for(let i=0;i<Math.round(W*H/90000)+4;i++) bright.push({x:Math.random()*W,y:Math.random()*H,r:1.2+Math.random()*1.3,c:TEMPS[[0,1,3,4,5][(Math.random()*5)|0]],tw:Math.random()*6.28});
  }
  function draw2(t){
    x.clearRect(0,0,W,H);
    for(const s of stars){
      const a=reduce?s.a:s.a*(.75+.25*Math.sin(s.tw+t*.0012*s.sp));
      x.globalAlpha=a; x.fillStyle=`rgb(${s.c})`; x.beginPath(); x.arc(s.x,s.y,s.r,0,6.283); x.fill();
    }
    for(const s of bright){
      const k=reduce?1:(.85+.15*Math.sin(s.tw+t*.0009));
      const g=x.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*7); g.addColorStop(0,`rgba(${s.c},${.9*k})`); g.addColorStop(.25,`rgba(${s.c},${.22*k})`); g.addColorStop(1,`rgba(${s.c},0)`);
      x.globalAlpha=1; x.fillStyle=g; x.beginPath(); x.arc(s.x,s.y,s.r*7,0,6.283); x.fill();
      x.strokeStyle=`rgba(${s.c},${.35*k})`; x.lineWidth=.8; const L=s.r*9*k;
      x.beginPath(); x.moveTo(s.x-L,s.y); x.lineTo(s.x+L,s.y); x.moveTo(s.x,s.y-L); x.lineTo(s.x,s.y+L); x.stroke();
      x.fillStyle='#fff'; x.beginPath(); x.arc(s.x,s.y,s.r*.7,0,6.283); x.fill();
    }
    x.globalAlpha=1;
  }
  addEventListener('resize',()=>{ build(); draw2(performance.now()); });
  build();

  let last=0;
  function loop(t){
    if(!document.hidden && t-last>40){ last=t; draw1&&draw1(t); draw2(t); }
    requestAnimationFrame(loop);
  }
  if(reduce){ draw1&&draw1(0); draw2(0); } else requestAnimationFrame(loop);
})();
</script>

/* ================= DATOS (Firebase o local) ================= */
const Store = {
  live:false, uid:null, listeners:[], loaded:new Set(), data:{events:{},artists:{},people:{}},
  emit(){ this.listeners.forEach(f=>f(this.data)); },
  onChange(f){ this.listeners.push(f); },
  async init(){
    if(FIREBASE_CONFIG && window.firebase){
      try{
        firebase.initializeApp(FIREBASE_CONFIG);
        const existing = await new Promise(r=>{ const u=firebase.auth().onAuthStateChanged(x=>{u();r(x);}); });
        const user = existing || (await firebase.auth().signInAnonymously()).user;
        this.uid=user.uid; this.live=true; this.fs=firebase.firestore();
        try{ await this.fs.enablePersistence({synchronizeTabs:true}); }catch(e){}
        for(const col of ['events','artists','people']){
          this.fs.collection(`crews/${CREW}/${col}`).onSnapshot(snap=>{
            const o={}; snap.forEach(d=>o[d.id]={id:d.id,...d.data()}); this.data[col]=o;
            this.loaded.add(col); if(this.loaded.size>=3) this.emit();
          }, err=>{ console.error(err); toast('Sin permiso para leer los datos. Revisa las reglas de Firestore.'); });
        }
        return;
      }catch(e){ console.error(e); toast('No se pudo conectar a Firebase. Usando modo local.'); }
    }
    this.uid = ls.get('fc.localUid') || ('local-'+rid(8)); ls.set('fc.localUid',this.uid);
    this.data = ls.get('fc.local.'+CREW, {events:{},artists:{},people:{}});
    addEventListener('storage',e=>{ if(e.key==='fc.local.'+CREW){ this.data=ls.get(e.key,this.data); this.emit(); } });
    setTimeout(()=>this.emit());
  },
  _saveLocal(){ ls.set('fc.local.'+CREW,this.data); this.emit(); },
  async set(col,id,obj){ if(this.live) return this.fs.doc(`crews/${CREW}/${col}/${id}`).set(obj); this.data[col][id]={id,...obj}; this._saveLocal(); },
  async merge(col,id,obj){ if(this.live) return this.fs.doc(`crews/${CREW}/${col}/${id}`).set(obj,{merge:true}); this.data[col][id]={...(this.data[col][id]||{id}),...obj}; this._saveLocal(); },
  async del(col,id){ if(this.live) return this.fs.doc(`crews/${CREW}/${col}/${id}`).delete(); delete this.data[col][id]; this._saveLocal(); },
  async batch(items){ // [{col,id,obj,merge}]
    if(this.live){ for(let i=0;i<items.length;i+=400){ const b=this.fs.batch(); items.slice(i,i+400).forEach(x=>b.set(this.fs.doc(`crews/${CREW}/${x.col}/${x.id}`),x.obj,x.merge?{merge:true}:{})); await b.commit(); } return; }
    items.forEach(x=>this.data[x.col][x.id]= x.merge?{...(this.data[x.col][x.id]||{id:x.id}),...x.obj}:{id:x.id,...x.obj}); this._saveLocal();
  }
};
const safe = p => Promise.resolve(p).catch(e=>{ console.error(e); toast('No se pudo guardar. Revisa tu conexión.'); });

/* ================= ESTADO ================= */
const S = { events:[], artists:[], people:{}, cur:ls.get('fc.ev'), tab:ls.get('fc.tab','cartel'),

Store.onChange(d=>{
  S.events=Object.values(d.events).sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));
  S.artists=Object.values(d.artists); S.people=d.people;

  showApp(); render();
});

/* ================= AYUDAS ================= */
function hue(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return h%360; }
function initials(n){ const w=String(n).replace(/[^\p{L}\p{N} ]/gu,' ').trim().split(/\s+/); return ((w[0]||'?')[0]+(w[1]?w[1][0]:(w[0]||'')[1]||'')).toUpperCase(); }
function avatar(a){
  if(a.photo) return `<img src="${esc(a.photo)}" alt="" loading="lazy">`;
  const h=hue(a.name), g=gcol(genreOf(a));
  return `<div class="mono-av" style="background:radial-gradient(110% 80% at 85% 115%,${g}b0,transparent 62%),radial-gradient(70% 60% at 15% 0%,hsl(${h} 20% 30%),transparent 70%),linear-gradient(160deg,#1b1b1e,#060607)">${esc(initials(a.name))}</div>`;
}
function pav(uid){ const p=S.people[uid]||{}; const n=p.name||'?';
  return `<span class="pav" title="${esc(uid===Store.uid?'Tú':n)}" style="background:${esc(p.color||'#555')}">${p.photo?`<img src="${esc(p.photo)}" alt="">`:esc(initials(n))}</span>`; }
const mins = t => { if(!t) return null; const [h,m]=String(t).split(':').map(Number); if(isNaN(h)) return null; return (h<9?h+24:h)*60+(m||0); };
const hhmm = m => { m=((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const fmtDate = (d,o={day:'numeric',month:'short'}) => { try{ return new Date(d+'T12:00:00').toLocaleDateString('es-MX',o);}catch(e){return d;} };
function daysUntil(d){ const a=new Date(); a.setHours(0,0,0,0); const b=new Date(d+'T00:00:00'); return Math.round((b-a)/864e5); }
const me = () => S.people[Store.uid] || {};
const curEvent = () => S.events.find(e=>e.id===S.cur) || null;
const evArtists = () => S.artists.filter(a=>a.eventId===S.cur);
const myEv = () => me().events?.[S.cur] || {};
function votesFor(aid, evId=S.cur){ const out=[]; for(const [uid,p] of Object.entries(S.people)){ const v=p.events?.[evId]?.votes; if(Array.isArray(v)&&v.includes(aid)) out.push(uid);} return out; }
const pname = uid => uid===Store.uid ? 'Tú' : (S.people[uid]?.name || 'Alguien');
function stack(uids,max=4){ if(!uids.length) return ''; return `<span class="stack">${uids.slice(0,max).map(pav).join('')}${uids.length>max?`<span class="more">+${uids.length-max}</span>`:''}</span>`; }
const dayShort = (ev,id) => { const d=(ev?.days||[]).find(d=>d.id===id); return d? d.label.split(' ')[0] : ''; };
function persist(){ ls.set('fc.tab',S.tab); ls.set('fc.group',S.group); if(S.cur) ls.set('fc.ev',S.cur); }
function saveMine(fn){
  const cur=structuredClone(me()); delete cur.id; cur.events=cur.events||{}; const e=cur.events[S.cur]=cur.events[S.cur]||{};
  fn(e); S.people[Store.uid]={id:Store.uid,...cur}; render();
  return safe(Store.set('people',Store.uid,cur));
}

/* partículas al votar */
function burst(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  const cols=['#E3262F','#FF4049','#2BD96B','#ffffff','#F5A524'];
  for(let i=0;i<22;i++){
    const p=document.createElement('span'); p.className='burst'; const s=4+Math.random()*6;
    p.style.cssText=`width:${s}px;height:${s}px;background:${cols[i%5]};box-shadow:0 0 10px ${cols[i%5]};transform:translate(${cx}px,${cy}px)`;
    document.body.appendChild(p);
    const ang=Math.random()*6.283, d=40+Math.random()*70;
    p.animate([{transform:`translate(${cx}px,${cy}px) scale(1)`,opacity:1},{transform:`translate(${cx+Math.cos(ang)*d}px,${cy+Math.sin(ang)*d}px) scale(.2)`,opacity:0}],
      {duration:650+Math.random()*350,easing:'cubic-bezier(.15,.8,.3,1)'}).onfinish=()=>p.remove();
  }
}

/* ================= RENDER ================= */
function render(){
  if($('#app').hidden) return;
  $('#mode').textContent = Store.live ? 'En vivo' : 'Modo local'; $('#mode').className='mode'+(Store.live?' live':'');
  $('#me').innerHTML = `<button class="mebtn" data-act="profile" title="Tu perfil">${pav(Store.uid)}<span>${esc(me().name||'')}</span></button>`;
  renderHero();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===S.tab));
  const live=liveNow(); const at=$('.tab[data-tab=ahora] svg'); at && at.parentElement.querySelector('.live-dot')?.remove();
  if(live && live.day) $('.tab[data-tab=ahora]').insertAdjacentHTML('beforeend','<span class="live-dot"></span>');
  const v=$('#view');
  if(!S.events.length){ v.innerHTML=`<div class="empty glass fade"><b>Tu crew aún no tiene eventos</b>Carga el Flow Fest 2026 con su cartel completo y EDC México 2027, o crea tu propio festival.
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn pri" data-act="seed">Cargar Flow Fest y EDC</button><button class="btn" data-act="newEvent">Crear evento</button></div></div>`; return; }
  ({ahora:renderAhora,cartel:renderCartel,timeline:renderTimeline,crew:renderCrew,eventos:renderEventos})[S.tab]();
}

function renderHero(){
  const ev=curEvent(); const sel=$('#evpick');
  sel.innerHTML=S.events.map(e=>`<option value="${esc(e.id)}"${e.id===S.cur?' selected':''}>${esc(e.name)}</option>`).join(''); sel.hidden=S.events.length<2;
  if(!ev){ $('#bandKicker').textContent='Tu crew de festivales'; $('#evName').textContent='Festi Crew'; $('#evMeta').innerHTML='<span>Votos, timeline y plan compartido para ir a festivales con amigos.</span>'; $('#count').innerHTML=''; $('#rsvp').innerHTML=''; return; }
  const d=daysUntil(ev.startDate), dEnd=daysUntil(ev.endDate||ev.startDate);
  $('#bandKicker').textContent = d>0 ? 'Próximo festival' : dEnd>=0 ? 'Hoy hay festival' : 'Festival pasado';
  $('#evName').textContent=ev.name;
  const range = ev.endDate && ev.endDate!==ev.startDate ? `${fmtDate(ev.startDate,{day:'numeric'})}–${fmtDate(ev.endDate,{day:'numeric',month:'long',year:'numeric'})}` : fmtDate(ev.startDate,{day:'numeric',month:'long',year:'numeric'});
  $('#evMeta').innerHTML=`<span><b>${esc(range)}</b></span><span>${esc(ev.venue||'Sede por confirmar')}</span><span>${evArtists().length} artistas</span>`;
  tickCountdown();
  const r=myEv().rsvp; const going=Object.entries(S.people).filter(([u,p])=>p.events?.[S.cur]?.rsvp==='yes').map(([u])=>u);
  $('#rsvp').innerHTML=`<span class="q">¿Vas?</span>
    ${[['yes','Voy'],['maybe','Tal vez'],['no','No voy']].map(([k,l])=>`<button class="rbtn" data-act="rsvp" data-v="${k}" aria-pressed="${r===k}">${l}</button>`).join('')}
    <span class="going">${stack(going,6)}<span>${going.length?`${going.length} ${going.length===1?'confirmado':'confirmados'}`:'Nadie ha confirmado aún'}</span></span>`;
}
function tickCountdown(){
  const ev=curEvent(); const box=$('#count'); if(!ev||!box) return;
  const start=new Date(ev.startDate+'T'+(ev.gates||'13:00')+':00'), diff=start-new Date();
  if(diff<=0){ const dEnd=daysUntil(ev.endDate||ev.startDate); box.innerHTML = dEnd>=0 ? `<div><b class="grad">HOY</b><span>a vivirlo</span></div>` : `<div><b>✓</b><span>ya pasó</span></div>`; return; }
  const D=Math.floor(diff/864e5), H=Math.floor(diff/36e5)%24, M=Math.floor(diff/6e4)%60, Sx=Math.floor(diff/1e3)%60;
  box.innerHTML=[[D,'días'],[H,'hrs'],[M,'min'],[Sx,'seg']].map(([n,l])=>`<div><b>${String(n).padStart(2,'0')}</b><span>${l}</span></div>`).join('');
}
setInterval(()=>{ if(!$('#app').hidden){ tickCountdown(); if(S.tab==='ahora' && !document.querySelector('dialog[open]')) renderAhora(true); } },1000);

/* ---------------- CARTEL ---------------- */
function renderCartel(){
  const ev=curEvent(); let list=evArtists(); const mv=new Set(myEv().votes||[]);
  if(S.day!=='all') list=list.filter(a=>a.day===S.day);
  if(S.genre!=='all') list=list.filter(a=>genreOf(a)===S.genre);
  if(S.q){ const q=slug(S.q); list=list.filter(a=>slug(a.name).includes(q)||slug(a.stage||'').includes(q)); }
  if(S.mine) list=list.filter(a=>mv.has(a.id));
  const present=[...new Set(evArtists().map(genreOf))].sort((a,b)=>Object.keys(GENRES).indexOf(a)-Object.keys(GENRES).indexOf(b));
  let h=`<div class="sect"><h2>Cartel</h2><span class="dim" style="font-size:14px;margin-bottom:3px">${mv.size} elegidos por ti</span><span class="sp"></span>
      <div class="seg" role="group" aria-label="Agrupar"><button data-act="group" data-v="tier" aria-pressed="${S.group==='tier'}">Por nivel</button><button data-act="group" data-v="genre" aria-pressed="${S.group==='genre'}">Por género</button></div></div>
    <div class="bar">
      <button class="chip" data-act="day" data-v="all" aria-pressed="${S.day==='all'}">Todos los días</button>
      ${(ev.days||[]).map(d=>`<button class="chip" data-act="day" data-v="${esc(d.id)}" aria-pressed="${S.day===d.id}">${esc(d.label)}</button>`).join('')}
      <button class="chip" data-act="mine" aria-pressed="${S.mine}">${HEART.replace('<svg','<svg width="13" height="13"')} Mis elegidos</button>
    </div>
    <div class="bar">
      <button class="chip" data-act="genre" data-v="all" aria-pressed="${S.genre==='all'}">Todos los géneros</button>
      ${present.map(g=>`<button class="chip" data-act="genre" data-v="${esc(g)}" aria-pressed="${S.genre===g}"><span class="dot" style="background:${gcol(g)};box-shadow:0 0 8px ${gcol(g)}"></span>${esc(g)}</button>`).join('')}
    </div>
    <div class="bar"><input class="search" id="q" type="search" placeholder="Buscar artista o escenario" value="${esc(S.q)}">
      <button class="btn" data-act="newArtist">+ Artista</button><button class="btn" data-act="importTimes">Importar horarios</button></div>
    <p class="note">Toca “Lo quiero ver” para elegir. Toca la foto para poner horario, escenario, género o subir una foto.</p>`;
  if(!list.length){ h+=`<div class="empty glass"><b>${evArtists().length?'Nada con ese filtro':'Este evento aún no tiene cartel'}</b>${evArtists().length?'Prueba otro día, otro género o borra la búsqueda.':'Agrega artistas con “+ Artista” cuando salga el line-up.'}</div>`; $('#view').innerHTML=h; bindSearch(); return; }
  const sorter=(a,b)=>(a.tier||3)-(b.tier||3)||(a.order??999)-(b.order??999)||a.name.localeCompare(b.name);
  if(S.group==='genre'){
    for(const g of Object.keys(GENRES)){
      const arr=list.filter(a=>genreOf(a)===g).sort(sorter); if(!arr.length) continue;
      const big=arr.filter(a=>(a.tier||3)<=2), small=arr.filter(a=>(a.tier||3)>2);
      h+=`<section class="tier fade"><header><span class="dot" style="width:10px;height:10px;border-radius:50%;background:${gcol(g)};box-shadow:0 0 12px ${gcol(g)}"></span><h3 style="color:${gcol(g)}">${esc(g)}</h3><span class="faint mono">${arr.length}</span><span class="ln"></span></header>
        ${big.length?`<div class="grid g2" style="margin-bottom:${small.length?'10px':'0'}">${big.map(a=>cardBig(a,ev,mv)).join('')}</div>`:''}
        ${small.length?`<div class="grid g3">${small.map(a=>cardRow(a,ev,mv)).join('')}</div>`:''}</section>`;
    }
  } else {
    for(const t of [1,2,3,4]){
      const g=list.filter(a=>(a.tier||3)===t).sort(sorter); if(!g.length) continue;
      h+=`<section class="tier fade"><header><h3>${TIERS[t]}</h3><span class="faint mono">${g.length}</span><span class="ln"></span></header>`;
      h+= t<=2 ? `<div class="grid ${t===1?'g1':'g2'}">${g.map(a=>cardBig(a,ev,mv)).join('')}</div>` : `<div class="grid g3">${g.map(a=>cardRow(a,ev,mv)).join('')}</div>`;
      h+=`</section>`;
    }
  }
  $('#view').innerHTML=h; bindSearch();
}

/* ---------------- TIMELINE ---------------- */
function dayList(dayId){
  const mv=new Set(myEv().votes||[]);
  const all=evArtists().filter(a=>a.day===dayId).map(a=>({...a,votes:votesFor(a.id),mine:mv.has(a.id)}));
  for(const a of all) a.pick = S.tlMode==='mine' ? a.mine : a.votes.length>=S.minVotes;
  return all;
}
function withClashes(list){
  const t=list.filter(a=>mins(a.start)!=null).sort((a,b)=>mins(a.start)-mins(b.start));
  for(const a of t){ a.s=mins(a.start); a.e=mins(a.end)??a.s+60; if(a.e<=a.s) a.e+=1440; a.clash=[]; a.lost=false; a.onRoute=false; }
  const picks=t.filter(a=>a.pick);
  for(let i=0;i<picks.length;i++) for(let j=i+1;j<picks.length;j++){ const x=picks[i],y=picks[j];
    if(y.s<x.e && x.s<y.e && (!x.stage||!y.stage||x.stage!==y.stage)){ x.clash.push(y); y.clash.push(x); } }
  // ruta: recorre los elegidos en orden; en un choque se queda el de más votos (en empate, el que ya estaba)
  const route=[];
  for(const a of picks){
    let keep=true;
    while(route.length){ const last=route[route.length-1];
      if(a.s < last.e - 5){ if(a.votes.length>last.votes.length){ last.lost=true; route.pop(); } else { a.lost=true; keep=false; break; } }
      else break; }
    if(keep) route.push(a);
  }
  route.forEach(a=>a.onRoute=true);
  t.route=route;
  return t;
}
function renderTimeline(){
  const ev=curEvent(); const days=ev.days||[];
  if(!S.tlDay || !days.find(d=>d.id===S.tlDay)) S.tlDay=days.find(d=>daysUntil(d.date)>=0)?.id || days[0]?.id;
  const all=dayList(S.tlDay); const timed=withClashes(all); const route=timed.route||[];
  const crewSize=Math.max(1,Object.keys(S.people).length); if(S.minVotes>crewSize) S.minVotes=crewSize;
  const picks=all.filter(a=>a.pick), clashes=timed.filter(a=>a.lost).length;
  const zoom=S.zoom||1;
  let h=`<div class="sect"><h2>Timeline</h2><span class="sp"></span>
      <div class="seg"><button data-act="tlMode" data-v="crew" aria-pressed="${S.tlMode==='crew'}">Del crew</button><button data-act="tlMode" data-v="mine" aria-pressed="${S.tlMode==='mine'}">Mía</button></div></div>
    <div class="bar">${days.map(d=>`<button class="chip" data-act="tlDay" data-v="${esc(d.id)}" aria-pressed="${S.tlDay===d.id}">${esc(d.label)}</button>`).join('')}
      ${S.tlMode==='crew'?`<span class="chip" style="gap:10px">Mín. votos <input type="range" id="minv" min="1" max="${crewSize}" value="${S.minVotes}" style="width:90px;accent-color:#E3262F"><b class="mono">${S.minVotes}</b></span>`:''}
      ${timed.length?`<span class="seg" style="margin-left:auto"><button data-act="zoom" data-v="1" aria-pressed="${zoom===1}">1×</button><button data-act="zoom" data-v="2" aria-pressed="${zoom===2}">2×</button><button data-act="zoom" data-v="3" aria-pressed="${zoom===3}">3×</button></span>`:''}</div>`;

  if(timed.length){
    // tira resumen de la ruta
    if(route.length){
      h+=`<div class="label" style="margin-bottom:8px">Ruta del crew · ${route.length} shows · ${hhmm(route[0].s)} a ${hhmm(route[route.length-1].e)}</div>
        <div class="routebar">${route.map((a,i)=>`${i?'<span class="rarrow">›</span>':''}<div class="rstop"><div class="av">${avatar(a)}</div><div><b>${esc(a.name)}</b><small>${hhmm(a.s)} · ${esc(a.stage||'—')}</small></div></div>`).join('')}</div>`;
    }
    const stages=[...new Set(timed.map(a=>a.stage||'Escenario'))];
    const order=ev.stages||[]; stages.sort((a,b)=>{ const i=order.indexOf(a), j=order.indexOf(b); return (i<0?99:i)-(j<0?99:j)||a.localeCompare(b); });
    const t0=Math.floor((Math.min(...timed.map(a=>a.s))-15)/60)*60, t1=Math.ceil((Math.max(...timed.map(a=>a.e))+15)/60)*60;
    const K=[0,1.35,2.1,3.1][zoom], HH=(t1-t0)*K, n=stages.length, cols=`repeat(${n},minmax(160px,1fr))`;
    let grid=''; for(let m=t0;m<=t1;m+=15) grid+=`<div class="hr${m%60?' q':''}" style="top:${(m-t0)*K}px"></div>`;
    let axis=''; for(let m=t0;m<=t1;m+=15){ if(m%60===0) axis+=`<span style="top:${(m-t0)*K}px">${hhmm(m)}</span>`; else if(zoom>=2) axis+=`<span class="q" style="top:${(m-t0)*K}px">:${String(m%60).padStart(2,'0')}</span>`; }
    const lv=liveNow(); const nowM = lv && lv.day===S.tlDay ? lv.m : null;
    const lanes=stages.map(st=>{
      const items=timed.filter(a=>(a.stage||'Escenario')===st).map(a=>{
        const cls=['blk', a.pick?'pick':'ghost', a.onRoute?'onr':'', a.lost?'lost':''].join(' ');
        const ht=Math.max(36,(a.e-a.s)*K-4), dur=a.e-a.s, playing=nowM!=null && a.s<=nowM && nowM<a.e;

          ${ht>=64?`<div class="av">${avatar(a)}</div>`:''}<div style="min-width:0"><b>${esc(a.name)}</b><small>${hhmm(a.s)}–${hhmm(a.e)} · ${dur} min${a.lost?' · pierde el choque':''}</small></div>
          ${playing?'<span class="live-tag">EN VIVO</span>':''}${a.votes.length?`<span class="vc">♥${a.votes.length}</span>`:''}</div>`; }).join('');
      return `<div class="lane" style="height:${HH}px">${grid}${items}</div>`;
    }).join('');
    // trazo de la ruta y avisos de traslado / tiempo libre
    const X = a => (stages.indexOf(a.stage||'Escenario')+.5)/n*1000;
    let path='', gaps='';
    for(let i=0;i<route.length-1;i++){
      const a=route[i], b=route[i+1]; const ya=(a.e-t0)*K, yb=(b.s-t0)*K, xa=X(a), xb=X(b), d=Math.max(14,(yb-ya)/2);
      path+=`M${xa.toFixed(1)} ${(ya-6).toFixed(1)} C${xa.toFixed(1)} ${(ya+d).toFixed(1)},${xb.toFixed(1)} ${(yb-d).toFixed(1)},${xb.toFixed(1)} ${(yb+8).toFixed(1)} `;
      const gap=b.s-a.e, moved=(a.stage||'')!==(b.stage||''); let cls='', txt='';
      if(moved && gap<10){ cls='rush'; txt=gap<=0?`Salir antes · cruzar a ${b.stage||'otro escenario'}`:`${gap} min para cruzar`; }
      else if(moved && gap>=40){ cls='free'; txt=`${gap} min libres · luego a ${b.stage||'otro escenario'}`; }
      else if(moved){ cls='move'; txt=`Cambio de escenario · ${gap} min`; }

      if(txt) gaps+=`<span class="gap ${cls}" style="left:${((xa+xb)/2/10).toFixed(2)}%;top:${((ya+yb)/2).toFixed(1)}px">${esc(txt)}</span>`;
    }
    const svg = path ? `<svg class="routesvg" viewBox="0 0 1000 ${HH.toFixed(0)}" preserveAspectRatio="none" aria-hidden="true"><path d="${path}" vector-effect="non-scaling-stroke"/></svg>` : '';
    const nowTop = nowM!=null && nowM>=t0 && nowM<=t1 ? `<div class="nowline" style="top:${(nowM-t0)*K}px"></div>` : '';
    const laneCount=st=>timed.filter(a=>(a.stage||'Escenario')===st&&a.onRoute).length;
    h+=`<div class="tlwrap glass fade">
      <div class="tlhead"><div class="tlstats"><span><b>${picks.length}</b> elegidos</span><span><b>${route.length}</b> en la ruta</span><span><b>${timed.length}</b> con horario</span>${clashes?`<span style="color:var(--red-hi)"><b style="color:var(--red-hi)">${clashes}</b> pierden por choque</span>`:'<span style="color:var(--green)">sin choques</span>'}</div></div>
      <div class="tlscroll"><div class="tl" style="grid-template-columns:58px ${cols}">
        <div class="lanehd"></div>${stages.map(s=>`<div class="lanehd">${esc(s)}<small>${laneCount(s)} en la ruta</small></div>`).join('')}
        <div class="axis" style="height:${HH}px;margin-top:14px">${axis}</div>
        <div style="grid-column:2/-1;position:relative;display:grid;margin-top:14px;grid-template-columns:${cols}">${lanes}${svg}${gaps}${nowTop}</div>
      </div></div>
      <div class="legend"><span><i style="background:rgba(227,38,47,.6);box-shadow:0 0 0 1.5px #FF4049"></i>En la ruta</span><span><i style="background:repeating-linear-gradient(135deg,rgba(227,38,47,.5) 0 3px,transparent 3px 6px)"></i>Pierde el choque</span><span><i style="background:rgba(255,255,255,.12)"></i>Posible</span><span><i style="background:var(--green)"></i>Ahora</span></div>

  if(routeList.length){

/* ---------------- AHORA (modo festival) ---------------- */
function liveNow(){
  const ev=curEvent(); if(!ev) return null;
  const now=new Date(), m=now.getHours()*60+now.getMinutes();
  const date=new Date(now.getTime()-now.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  if(S.sim){ return {day:S.sim.day, m:mins(S.sim.time)}; }
  for(const d of ev.days||[]){
    if(d.date===date && m>=9*60) return {day:d.id,m};
    const nx=new Date(d.date+'T12:00:00'); nx.setDate(nx.getDate()+1);
    if(nx.toISOString().slice(0,10)===date && m<9*60) return {day:d.id,m:m+1440};
  }
  return {day:null,m};
}

        :`<div class="dim" style="margin-top:6px">Nadie del plan está tocando en este momento.</div>`}

const fmtIn = d => d<60 ? `en ${d} min` : `en ${Math.floor(d/60)} h ${String(d%60).padStart(2,'0')}`;

/* ---------------- CREW ---------------- */
function affinity(u1,u2){
  const a=new Set(S.people[u1]?.events?.[S.cur]?.votes||[]), b=new Set(S.people[u2]?.events?.[S.cur]?.votes||[]);
  if(!a.size||!b.size) return null;
  let inter=0; a.forEach(x=>{ if(b.has(x)) inter++; });
  return {pct:Math.round(inter/(a.size+b.size-inter)*100), common:[...a].filter(x=>b.has(x))};
}
function renderCrew(){
  const ev=curEvent(); const m=myEv(); const ppl=Object.entries(S.people);
  const order={yes:0,maybe:1,no:2}; ppl.sort((a,b)=>(order[a[1].events?.[S.cur]?.rsvp]??3)-(order[b[1].events?.[S.cur]?.rsvp]??3));
  const lbl={yes:['yes','Voy'],maybe:['maybe','Tal vez'],no:['no','No voy']}, tk={have:'Ya tiene boleto',buy:'Por comprar'};
  const people=ppl.map(([u,p])=>{ const e=p.events?.[S.cur]||{}; const s=lbl[e.rsvp];
    return `<div class="person">${pav(u)}<div style="min-width:0"><b>${esc(pname(u))}</b><small>${[tk[e.ticket]||'', e.ticketType||'', (e.votes||[]).length+' elegidos'].filter(Boolean).map(esc).join(' · ')}</small></div>${s?`<span class="st ${s[0]}">${s[1]}</span>`:'<span class="st none">—</span>'}</div>`; }).join('');
  const ranked=evArtists().map(a=>({a,n:votesFor(a.id).length})).filter(x=>x.n>0).sort((x,y)=>y.n-x.n).slice(0,10); const top=ranked[0]?.n||1;
  const rank=ranked.length?ranked.map((x,i)=>`<div class="rank"><span class="mono faint">${i+1}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700">${esc(x.a.name)}</span><span class="mono" style="text-align:right">${x.n}</span><span></span><div class="bar2"><i style="width:${x.n/top*100}%"></i></div></div>`).join(''):`<div class="dim" style="font-size:14px">Sin votos todavía. Ve al Cartel y elige a tus favoritos.</div>`;
  // match musical
  const others=ppl.map(([u])=>u).filter(u=>u!==Store.uid).map(u=>({u,af:affinity(Store.uid,u)})).filter(x=>x.af).sort((a,b)=>b.af.pct-a.af.pct);
  const byId=id=>S.artists.find(a=>a.id===id);
  let match;
  if(!(m.votes||[]).length) match=`<div class="dim" style="font-size:14px">Elige artistas en el Cartel y aquí ves qué tanto coincides con cada quien.</div>`;

    const u=arr.filter(a=>mins(a.start)==null).sort((a,b)=>(a.tier||3)-(b.tier||3)||(a.order??0)-(b.order??0)); return [...t,...u]; };

  form.onsubmit=e=>{ e.preventDefault(); const name=$('#fName').value.trim(); if(!name) return;

      special:!!editing.special, order:editing.order??999, photo: pendingPhoto===undefined?(editing.photo||''):pendingPhoto};
    safe(Store.set('artists',editing.id||(S.cur+'--'+slug(name)+'-'+rid(4)),data)); dlg.close(); toast('Guardado'); };
  dlg.showModal();
}
function openEvent(e){

  form.innerHTML=`<h2>${e?'Editar evento':'Nuevo evento'}</h2>

    <div class="two"><div class="field"><label for="eStart">Primer día</label><input class="inp" type="date" id="eStart" required value="${esc(ev.startDate||'')}"></div>

    <div class="field"><label for="ePrices">Precios (uno por línea: nombre | precio)</label><textarea class="inp mono" id="ePrices" placeholder="General Fase 1 | $3,075 MXN">${esc((ev.prices||[]).map(p=>p.label+' | '+p.price).join('\n'))}</textarea></div>
    <div class="field"><label for="eLink">Liga de boletos</label><input class="inp" id="eLink" type="url" value="${esc(ev.link||'')}" placeholder="https://"></div>
    <div class="field"><label for="eNotes">Notas</label><input class="inp" id="eNotes" value="${esc(ev.notes||'')}" placeholder="Preventas, cómo llegar…"></div>
    <div class="foot">${e?'<button type="button" class="btn danger l" data-act="delEvent">Eliminar</button>':''}<button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="submit" class="btn pri">Guardar</button></div>`;
  form.onsubmit=x=>{ x.preventDefault(); const start=$('#eStart').value, end=$('#eEnd').value||start; if(!start||!$('#eName').value.trim()) return;

      const iso=d.toISOString().slice(0,10), wd=d.toLocaleDateString('es-MX',{weekday:'long'}); days.push({id:iso,label:wd[0].toUpperCase()+wd.slice(1)+' '+d.getDate(),date:iso}); }
    const data={name:$('#eName').value.trim(),venue:$('#eVenue').value.trim(),startDate:start,endDate:end,days,
      stages:$('#eStages').value.split(',').map(s=>s.trim()).filter(Boolean),

    const id=e?.id||slug(data.name)+'-'+rid(3); S.cur=id; persist(); safe(Store.set('events',id,data)); dlg.close(); toast('Evento guardado'); };
  dlg.showModal();

      <button type="button" class="btn" data-act="pickPhoto">Subir foto</button></div>

    const name=$('#pName').value.trim().slice(0,30); if(!name) return;

/* importar horarios en bloque: "21:30-22:45 Anuel AA | Escenario Coca-Cola" */
function parseTimes(text,dayId){
  const arts=evArtists().filter(a=>a.day===dayId);
  const out=[];
  for(const raw of text.split('\n')){
    const line=raw.trim(); if(!line) continue;
    const m=line.match(/(\d{1,2})[:.h](\d{2})\s*(?:-|–|—|a|to)?\s*(?:(\d{1,2})[:.h](\d{2}))?/i);
    if(!m){ out.push({line,ok:false}); continue; }
    const start=`${m[1].padStart(2,'0')}:${m[2]}`, end=m[3]?`${m[3].padStart(2,'0')}:${m[4]}`:'';
    let rest=line.replace(m[0],' ').trim(); let stage='';
    const sp=rest.split(/\s*[|@]\s*/); if(sp.length>1){ rest=sp[0]; stage=sp.slice(1).join(' ').trim(); }
    const key=slug(rest.replace(/^[-–—:·\s]+|[-–—:·\s]+$/g,''));
    let hit=arts.find(a=>slug(a.name)===key) || arts.find(a=>key && (slug(a.name).includes(key)||key.includes(slug(a.name))));
    out.push({line,ok:!!hit,a:hit,start,end,stage});
  }
  return out;
}
function openImport(){
  const ev=curEvent(); const day=S.day!=='all'?S.day:ev.days?.[0]?.id;
  form.innerHTML=`<h2>Importar horarios</h2>
    <p class="dim" style="margin-top:0;font-size:14px">Pega los horarios, uno por línea. Ejemplo: <span class="mono" style="color:var(--ink)">21:30-22:45 Anuel AA | Escenario Coca-Cola</span>. El escenario es opcional.</p>
    <div class="field"><label for="iDay">Día</label><select class="inp" id="iDay">${(ev.days||[]).map(d=>`<option value="${esc(d.id)}"${d.id===day?' selected':''}>${esc(d.label)}</option>`).join('')}</select></div>
    <div class="field"><label for="iText">Horarios</label><textarea class="inp mono" id="iText" style="min-height:150px" placeholder="16:00-16:40 Novato El Flow&#10;23:10-00:40 Anuel AA | Principal"></textarea></div>
    <div class="preview" id="iPrev"><span class="faint">La vista previa aparece aquí.</span></div>
    <div class="foot"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button type="submit" class="btn pri" id="iGo" disabled>Aplicar</button></div>`;
  const upd=()=>{ const r=parseTimes($('#iText').value,$('#iDay').value); const ok=r.filter(x=>x.ok);
    $('#iPrev').innerHTML=r.length?r.map(x=>x.ok?`<div><span class="mono" style="color:var(--green)">${esc(x.start)}${x.end?'–'+esc(x.end):''}</span><b>${esc(x.a.name)}</b>${x.stage?`<span class="dim">${esc(x.stage)}</span>`:''}</div>`:`<div class="x">No reconocí: ${esc(x.line)}</div>`).join(''):'<span class="faint">La vista previa aparece aquí.</span>';
    $('#iGo').disabled=!ok.length; $('#iGo').textContent=ok.length?`Aplicar ${ok.length}`:'Aplicar'; return ok; };
  $('#iText').addEventListener('input',upd); $('#iDay').addEventListener('change',upd);
  form.onsubmit=async e=>{ e.preventDefault(); const ok=upd(); if(!ok.length) return;
    const items=ok.map(x=>({col:'artists',id:x.a.id,merge:true,obj:Object.assign({start:x.start,end:x.end},x.stage?{stage:x.stage}:{})}));
    const stages=[...new Set(ok.map(x=>x.stage).filter(Boolean))]; const evs=curEvent();
    if(stages.some(s=>!(evs.stages||[]).includes(s))) items.push({col:'events',id:evs.id,merge:true,obj:{stages:[...new Set([...(evs.stages||[]),...stages])]}});
    await safe(Store.batch(items)); dlg.close(); toast(`${ok.length} horarios cargados`); };
  dlg.showModal();
}

/* foto → JPEG pequeño */
$('#photoIn').addEventListener('change',e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{ const s=260, c=document.createElement('canvas'); c.width=s; c.height=s;
    const k=Math.max(s/img.width,s/img.height), w=img.width*k, h=img.height*k;
    c.getContext('2d').drawImage(img,(s-w)/2,(s-h)/2,w,h); pendingPhoto=c.toDataURL('image/jpeg',.8); URL.revokeObjectURL(url);
    $('#phPrev').innerHTML=`<img src="${pendingPhoto}" alt="">`; };
  img.onerror=()=>toast('No se pudo leer esa imagen.'); img.src=url;
});

async function seed(){
  const items=[]; for(const [id,obj] of Object.entries(SEED.events)) items.push({col:'events',id,obj});
  for(const a of SEED.artists){ const {id,...obj}=a; items.push({col:'artists',id,obj}); }
  S.cur='flow-fest-2026'; persist(); await safe(Store.batch(items)); toast('Flow Fest 2026 y EDC México 2027 cargados');
}

/* ================= INTERACCIÓN ================= */
$('#tabs').addEventListener('click',e=>{ const t=e.target.closest('.tab'); if(!t) return; S.tab=t.dataset.tab; persist(); render(); scrollTo({top:$('main').offsetTop-80,behavior:'smooth'}); });
$('#evpick').addEventListener('change',e=>{ S.cur=e.target.value; S.day='all'; S.genre='all'; S.tlDay=null; S.sim=null; persist(); render(); });
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id, v=b.dataset.v;
  if(act==='vote'){ const was=(myEv().votes||[]).includes(id); if(!was) burst(b);
    saveMine(x=>{ const s=new Set(x.votes||[]); was?s.delete(id):s.add(id); x.votes=[...s]; }); }
  else if(act==='rsvp'){ if(v==='yes' && myEv().rsvp!=='yes') burst(b); saveMine(x=>{ x.rsvp=x.rsvp===v?null:v; }); }
  else if(act==='day'){ S.day=v; renderCartel(); }
  else if(act==='genre'){ S.genre=v; renderCartel(); }
  else if(act==='group'){ S.group=v; persist(); renderCartel(); }
  else if(act==='mine'){ S.mine=!S.mine; renderCartel(); }
  else if(act==='tlDay'){ S.tlDay=v; renderTimeline(); }
  else if(act==='tlMode'){ S.tlMode=v; renderTimeline(); }
  else if(act==='go'){ if(dlg.open) dlg.close(); S.tab=v; persist(); render(); }
  else if(act==='zoom'){ S.zoom=+v; renderTimeline(); }
  else if(act==='band') openBand();
  else if(act==='storyDay'){ storyDay=v; form.querySelectorAll('[data-act=storyDay]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v)); renderStoryPreview(); }
  else if(act==='shareStory') shareStory();
  else if(act==='saveStory') saveStory();
  else if(act==='sim'){ S.sim={day:$('#simDay').value,time:$('#simTime').value||'22:00'}; renderAhora(); }
  else if(act==='simOff'){ S.sim=null; renderAhora(); }
  else if(act==='editArtist') openArtist(S.artists.find(a=>a.id===id));
  else if(act==='newArtist') openArtist(null);
  else if(act==='importTimes') openImport();
  else if(act==='pickPhoto') $('#photoIn').click();
  else if(act==='rmPhoto'){ pendingPhoto=''; $('#phPrev').innerHTML=avatar({name:$('#fName').value||'?'}); }
  else if(act==='delArtist'){ const a=editing; confirmIn(`¿Eliminar a ${a.name}?`,()=>safe(Store.del('artists',a.id))); }
  else if(act==='close') dlg.close();
  else if(act==='newEvent') openEvent(null);
  else if(act==='editEvent') openEvent(S.events.find(x=>x.id===id));
  else if(act==='delEvent'){ const evId=editingEv, e2=S.events.find(x=>x.id===evId);
    confirmIn(`¿Eliminar ${e2?.name||'el evento'} y su cartel?`,()=>{ S.artists.filter(a=>a.eventId===evId).forEach(a=>safe(Store.del('artists',a.id))); safe(Store.del('events',evId)); }); }
  else if(act==='pickEv'){ S.cur=id; S.day='all'; S.genre='all'; S.tlDay=null; S.sim=null; S.tab='cartel'; persist(); render(); scrollTo({top:0}); }
  else if(act==='saveMeet'){ const ev=curEvent(); if(ev){ safe(Store.merge('events',ev.id,{meetup:$('#meet').value.slice(0,600)})); toast('Punto de encuentro guardado'); } }
  else if(act==='profile') openProfile();
  else if(act==='invite') invite();
  else if(act==='seed') seed();
  else if(act==='install') installApp();
});

/* ================= INSTALAR LA APP ================= */
function isStandalone(){ return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true; }
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; syncInstallBtn(); });
addEventListener('appinstalled',()=>{ deferredInstall=null; syncInstallBtn(); toast('Festi Crew instalada en tu pantalla de inicio'); });
function syncInstallBtn(){ const b=$('#installBtn'); if(b) b.hidden=isStandalone(); }
async function installApp(){
  if(deferredInstall){ deferredInstall.prompt(); const r=await deferredInstall.userChoice.catch(()=>null); deferredInstall=null; if(r&&r.outcome==='accepted') toast('Instalando…'); return; }
  const ua=navigator.userAgent, ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1), android=/Android/i.test(ua);
  const step=(n,t)=>`<div style="display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--edge)"><span class="mono" style="font-size:22px;font-weight:800;color:var(--red-hi)">0${n}</span><div>${t}</div></div>`;
  const iosSteps=step(1,'Abre esta página en <b>Safari</b>.')+step(2,'Toca el botón <b>Compartir</b> (el cuadro con la flecha hacia arriba).')+step(3,'Elige <b>Agregar a pantalla de inicio</b> y luego <b>Agregar</b>.');
  const andSteps=step(1,'Abre esta página en <b>Chrome</b>.')+step(2,'Toca el menú <b>⋮</b> arriba a la derecha.')+step(3,'Elige <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.');
  const pcSteps=step(1,'Abre esta página en <b>Chrome</b> o <b>Edge</b>.')+step(2,'Haz clic en el ícono de instalar <b>⊕</b> a la derecha de la barra de direcciones.')+step(3,'Confirma con <b>Instalar</b>.');
  const local=location.protocol==='file:';
  form.innerHTML=`<h2>Descargar la app</h2>
    <p class="dim" style="margin-top:0">Queda como app en tu pantalla de inicio, se abre a pantalla completa y funciona aunque no haya señal en el festival.</p>
    ${local?'<p class="mode" style="display:block;text-transform:none;letter-spacing:0;font-size:13px;border-radius:9px;padding:8px 10px">Para instalarla, ábrela desde tu link de GitHub Pages (https). Abierta como archivo no se puede instalar.</p>':''}
    <div class="label" style="margin:6px 0 2px">${ios?'En iPhone':android?'En Android':'En tu compu'}</div>
    ${ios?iosSteps:android?andSteps:pcSteps}
    ${ios||android?'':`<div class="label" style="margin:16px 0 2px">En el celular</div>${step(1,'iPhone: Safari → Compartir → Agregar a pantalla de inicio.')}${step(2,'Android: Chrome → menú ⋮ → Instalar app.')}`}
    <div class="foot" style="margin-top:14px"><button type="button" class="btn pri" data-act="close">Entendido</button></div>`;
  dlg.showModal();
}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e)));
}
{ const t=params.get('tab'); if(t && ['ahora','cartel','timeline','crew','eventos'].includes(t)) S.tab=t; }
syncInstallBtn();

Store.init();
})();
